# Falco Helm values. Consumed by gitops/falco.yaml (ArgoCD multi-source).
driver:
  # CO-RE eBPF — the right default for a real-kernel node.
  # WHERE FALCO ACTUALLY WORKS (tested empirically on an arm64 Mac):
  #   * Docker Desktop          -> CRASHES (LinuxKit kernel: no raw-tracepoint BPF)
  #   * Colima + k3d (this lab) -> RUNS, loads these rules, but 0 capture (no
  #                                hostPID; k3d nodes are containers)
  #   * minikube + vfkit (arm64)-> CRASHES (modern_ebpf probe error; kmod won't
  #                                build/load on the ISO kernel)
  #   * Real x86_64 Linux node  -> FULL detection (cloud/VM) — the supported setup
  #                                (needs Falco >= 0.45.1 on recent kernels, see
  #                                gitops/falco.yaml)
  # Not a config bug: Falco schema-validates these rules everywhere; they fire on
  # a real node. The chart sets no hostPID, and patching it is blocked by its own
  # privileged:true + allowPrivilegeEscalation:false securityContext.
  kind: modern_ebpf

# Explicit on purpose: a Kyverno "add default securityContext" mutation (e.g.
# the one secure-ai-gateway installs) only fills fields that are absent. Left
# empty, it injects allowPrivilegeEscalation:false next to privileged:true,
# which the API server rejects, and runAsNonRoot:true, which a root image
# cannot satisfy. Setting containerSecurityContext also replaces the chart's
# driver-derived default, so privileged must be repeated here.
podSecurityContext:
  runAsNonRoot: false
containerSecurityContext:
  privileged: true
  allowPrivilegeEscalation: true

# Emit alerts as JSON to stdout so `make falco-events` (kubectl logs) shows them.
tty: true
falco:
  json_output: true
  json_include_output_property: true

# Our detections for the attacks documented in project #4 (offensive-writeups).
customRules:
  custom-rules.yaml: |-
    # Known exec health probes (readiness/liveness) that would otherwise fire
    # the rule below every few seconds. Each entry is pinned to its namespace
    # and the probe's exact command, so a shell or curl doing anything else
    # in the same pod still alerts.
    #   * ai-gateway postgres  (secure-ai-gateway charts/ai-gateway/templates/postgres.yaml)
    #   * flow-doctor paperclip (homelab-apps manifests/flow-doctor/deployment.yaml)
    - macro: known_exec_probe
      condition: >
        (k8s.ns.name = ai-gateway
         and proc.cmdline = "sh -c pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"")
        or (k8s.ns.name = flow-doctor
            and proc.cmdline in ("curl -fsS -m 3 http://127.0.0.1:3100/api/health",
                                 "curl -fsS -m 5 http://127.0.0.1:3100/api/health"))

    - rule: Suspicious tool executed in container
      desc: A shell / recon / exfil tool ran inside a container — likely post-exploitation
      condition: >
        spawned_process and container
        and proc.name in (sh, bash, ash, dash, nc, ncat, netcat, nmap, sqlmap, wget, curl, socat)
        and not known_exec_probe
      output: >
        Suspicious process in container (proc=%proc.name cmdline=%proc.cmdline
        image=%container.image.repository pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [container, shell, mitre_execution, T1059]

    - rule: Package manager run in container
      desc: A package manager ran in a container — an attacker installing tools at runtime
      condition: >
        spawned_process and container
        and proc.name in (apk, apt, apt-get, dnf, yum, pip, pip3, npm, gem)
      output: >
        Package manager in container (proc=%proc.name cmdline=%proc.cmdline
        image=%container.image.repository pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [container, mitre_execution]

    - rule: Sensitive credential file read in container
      desc: Read of a high-value credential file inside a container
      condition: >
        open_read and container
        and fd.name in (/etc/shadow, /root/.kube/config)
      output: >
        Sensitive file read (file=%fd.name proc=%proc.name
        image=%container.image.repository pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [filesystem, mitre_credential_access, T1552]
