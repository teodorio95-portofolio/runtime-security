# Falco runtime threat detection, deployed via ArgoCD (multi-source: the upstream
# Falco chart + our values/rules from this repo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://falcosecurity.github.io/charts
      chart: falco
      # >= 9.2.1 (Falco >= 0.45.1): older releases crash-loop on kernels with the
      # "mark signal tracepoint siginfo as scalar" verifier change (Debian
      # 6.12.116, 6.18.53+): falcosecurity/falco#4017, falcosecurity/libs#3119.
      targetRevision: 9.2.2
      helm:
        valueFiles:
          - $rs/falco/values.yaml
    - repoURL: https://gitlab.com/teodorio95/runtime-security.git
      targetRevision: HEAD
      ref: rs
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
